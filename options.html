<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Настройки Polyglot</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <header>
      <div class="logo" aria-hidden="true">文<span>A</span></div>
      <div><h1>Polyglot</h1><p>Перевод выделенного текста</p></div>
    </header>
    <form id="settings">
      <div class="languages">
        <label>Исходный язык<select name="sourceLanguage" id="sourceLanguage"></select></label>
        <span aria-hidden="true">→</span>
        <label>Язык перевода<select name="targetLanguage" id="targetLanguage"></select></label>
      </div>
      <label class="check"><input type="checkbox" name="instantTranslation">Переводить сразу после выделения текста</label>
      <label class="check"><input type="checkbox" name="confirmInstantTranslation">Перед переводом показывать значок подтверждения</label>

      <h2>Всплывающее окно</h2>
      <div class="number-grid">
        <label>Ширина, px<input type="number" name="popupWidth" min="240" max="600" step="1"></label>
        <label>Максимальная высота, px<input type="number" name="popupHeight" min="180" max="700" step="1"></label>
        <label>Размер текста, px<input type="number" name="popupFontSize" min="12" max="28" step="1"></label>
        <label>Отступы по бокам, px<input type="number" name="popupPaddingX" min="4" max="48" step="1"></label>
        <label>Отступы сверху и снизу, px<input type="number" name="popupPaddingY" min="4" max="48" step="1"></label>
        <label>Отступ от выделения, px<input type="number" name="popupOffset" min="0" max="40" step="1"></label>
      </div>
      <div class="color-grid">
        <div class="color-setting">
          <label for="popupTextColor">Цвет текста</label>
          <div class="color-controls"><input type="color" name="popupTextColor" id="popupTextColor"><label class="check"><input type="checkbox" name="popupTextColorAuto">По теме браузера</label></div>
        </div>
        <div class="color-setting">
          <label for="popupBackgroundColor">Цвет фона</label>
          <div class="color-controls"><input type="color" name="popupBackgroundColor" id="popupBackgroundColor"><label class="check"><input type="checkbox" name="popupBackgroundAuto">По теме браузера</label></div>
        </div>
      </div>
      <label class="check"><input type="checkbox" name="showCloseButton">Показывать крестик закрытия</label>
      <button id="resetAppearance" type="button">Вернуть оформление по умолчанию</button>

      <p class="hint">Ручной перевод доступен через значок расширения и контекстное меню. Сочетание клавиш настраивается на странице <a href="chrome://extensions/shortcuts">chrome://extensions/shortcuts</a>.</p>
      <p class="hint">Выделенный текст отправляется в Google для перевода.</p>
      <p id="status" role="status" aria-live="polite">Настройки сохраняются автоматически.</p>
    </form>
  </main>
  <script src="options.js"></script>
</body>
</html>
